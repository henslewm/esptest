; esptest — Waveshare ESP32-S3-Zero firmware
; Hardware (confirmed via `esptool flash-id`, 2026-10-04, COM7):
;   ESP32-S3 (QFN56) rev v0.2 | 4MB embedded flash (quad/XMC) | 2MB embedded PSRAM (quad, AP_3v3, 3.3V)
;   MAC d4:05:92:46:94:24 | stock USB mode: USB-Serial/JTAG (303A:1001)
; Core pin: Arduino-ESP32 3.3.12 via pioarduino (ESP-IDF 5.5.5), per docs/PLATFORMIO.md.
; USB: HID needs TinyUSB, so ARDUINO_USB_MODE=0 (USB-OTG). CDC kept on for serial logging.

[env:dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.psram_type = qspi
board_build.partitions = huge_app.csv

; The board manifest forces -DARDUINO_USB_MODE=1 (hardware USB-Serial/JTAG), which overrides
; a plain build_flags entry and blocks TinyUSB HID. board_build.extra_flags replaces the
; manifest's extra_flags, so set OTG/TinyUSB mode here.
board_build.extra_flags = -DARDUINO_USB_MODE=0

lib_ldf_mode = deep+

; The bundled USB library compiles its MSC sources, which include FS.h; the pioarduino LDF
; does not honor the USB lib's depends=FS. add_fs_include.py resolves the framework package
; dir at build time and puts the bundled FS source on the include path (portable across machines).
extra_scripts = pre:add_fs_include.py

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Select by hardware id, never a fixed COM number (docs/PLATFORMIO.md).
; In TinyUSB/OTG mode the stock USB-Serial/JTAG auto-reset is gone; enter the ROM
; bootloader manually (hold BOOT, tap RESET, release BOOT), which enumerates the
; USB-Serial/JTAG at 303A:1001 for esptool. See docs/BLE_NOTES.md / HARDWARE_BASELINE.md.
upload_port = hwgrep://303A:1001
monitor_port = hwgrep://303A:1001
